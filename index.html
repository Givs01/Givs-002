<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Energy Assessment Portal for ULB energy assessment and data collection"
  >

  <meta
    name="theme-color"
    content="#075985"
  >

  <title>Energy Assessment Portal</title>

  <!-- Tailwind CSS -->
  <link
    rel="stylesheet"
    href="./dist/styles.css"
  >

</head>

<body class="flex min-h-screen flex-col bg-slate-50 text-slate-900 antialiased">

  <!-- =========================================================
       APPLICATION HEADER
       ========================================================= -->

  <header
    class="relative shrink-0 overflow-hidden
          border-b border-sky-800/30
          bg-gradient-to-br
          from-portal-900
          via-portal-800
          to-portal-600
          text-white
          shadow-lg shadow-sky-900/10"
  >

    <!-- Decorative background -->

    <div
      class="pointer-events-none absolute
             -right-32 -top-40
             h-96 w-96
             rounded-full
             bg-white/10
             blur-3xl"
      aria-hidden="true"
    ></div>

    <div
      class="pointer-events-none absolute
             -bottom-40 left-1/3
             h-72 w-72
             rounded-full
             bg-sky-300/10
             blur-3xl"
      aria-hidden="true"
    ></div>


    <!-- Header Content -->

    <div
      class="relative z-10
             mx-auto flex max-w-7xl
             items-center justify-between
             gap-4
             px-4 py-4
             sm:px-6 sm:py-5
             lg:px-8"
    >


      <!-- =====================================================
           PORTAL BRAND
           ===================================================== -->

      <div class="flex min-w-0 items-center gap-3 sm:gap-4">


        <!-- Portal Mark -->

        <div
          class="flex h-10 w-10 shrink-0
                 items-center justify-center
                 rounded-xl
                 bg-white
                 text-lg font-extrabold
                 text-portal-800
                 shadow-lg shadow-sky-950/20
                 ring-1 ring-white/30
                 sm:h-11 sm:w-11
                 sm:text-2xl"
          aria-hidden="true"
        >
          EA
        </div>


        <!-- Portal Name -->

        <div class="min-w-0">

          <h1
            class="truncate
                   text-base
                   font-bold
                   tracking-tight
                   text-white
                   sm:text-2xl"
          >
            Energy Assessment Portal
          </h1>

          <p
            class="hidden
                   truncate
                   text-xs
                   text-sky-100/90
                   sm:block sm:text-sm"
          >
            A CWAS initiative
          </p>

        </div>

      </div>


      <!-- =====================================================
           PAS LOGO
           ===================================================== -->

      <div
        class="shrink-0
               border-l border-white/20
               pl-3
               sm:pl-5"
      >

        <div
          class="flex items-center
                 rounded-xl
                 bg-white
                 px-3 py-2
                 shadow-lg shadow-sky-950/20
                 ring-1 ring-white/20
                 sm:px-4 sm:py-2.5"
        >

          <img
            class="h-8 w-auto
                   max-w-[130px]
                   object-contain
                   sm:h-10 sm:max-w-[160px]"
            src="https://pas.org.in/image/company_logo?img_id=17511&t=1791000247227"
            alt="PAS"
          >

        </div>

      </div>

    </div>


    <!-- Header Accent -->

    <div
      class="relative z-10
             h-px
             bg-gradient-to-r
             from-transparent
             via-white/30
             to-transparent"
      aria-hidden="true"
    ></div>

  </header>


  <!-- =========================================================
       MAIN APPLICATION
       ========================================================= -->

  <main
    id="app"
    class="mx-auto w-full
          max-w-7xl
          flex-1
          px-4 py-6
          sm:px-6 sm:py-8
          lg:px-8"
  >
    <!-- JavaScript renders the current route here -->

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

<footer class="shrink-0 border-t border-slate-200 bg-white">
    <div
      class="mx-auto flex max-w-7xl
             flex-col gap-3
             px-4 py-5
             text-xs
             sm:flex-row
             sm:items-center
             sm:justify-between
             sm:px-6
             lg:px-8"
    >

      <!-- Footer Brand -->

      <div class="flex items-center gap-2">

        <span class="font-medium text-slate-600">
          Powered by "PAS Project"
        </span>

      </div>


      <!-- Footer Information -->

      <div
        class="flex items-center gap-3
               text-slate-400"
      >

        <span>
          Designed for CWAS, CRDF, CEPT University
        </span>

        <span id="app-version">
          <!-- Version inserted by JavaScript -->
        </span>

      </div>

    </div>

  </footer>


  <!-- =========================================================
       EXTERNAL LIBRARIES
       ========================================================= -->

  <script
    src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
  ></script>


  <!-- =========================================================
       APPLICATION JAVASCRIPT
       ========================================================= -->

  <script
    type="module"
    src="assets/js/app/main.js"
  ></script>

</body>

</html>
